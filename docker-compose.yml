services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: customs_user
      POSTGRES_PASSWORD: customs_dev_password
      POSTGRES_DB: customs_engine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customs_user -d customs_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      CUSTOMS_SERVE_FRONTEND: "true"
      CUSTOMS_DATABASE_URL: postgresql+psycopg://customs_user:customs_dev_password@db:5432/customs_engine
      LANGGRAPH_CHECKPOINT_BACKEND: postgres
      REGULATORY_ENABLE_REAL_MODELS: ${REGULATORY_ENABLE_REAL_MODELS:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - uploads_data:/app/backend/uploads

volumes:
  pgdata: {}
  uploads_data: {}
