; Type-checking configuration.
;
; Run the complete check with:
;     python -m mypy app scripts tests
;
; The only entries here are third-party modules that ship no type information.
; PyMuPDF is imported two ways: the modern `pymupdf` name is typed and is what
; the application and the current scripts use, while the legacy `fitz` alias
; carries no py.typed marker and cannot be fixed with stubs. Two older scripts
; still import it. Nothing in this file suppresses an error in project code.

[mypy]
python_version = 3.11

[mypy-fitz.*]
ignore_missing_imports = True
