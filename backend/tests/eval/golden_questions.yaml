# Golden evaluation set for the general Customs Assistant.
# docs/CUSTOMS_CHATBOT_ARCHITECTURE.md section 14.1.
#
# 91 questions (the doc's aspirational target was 150 - this is a real
# starter set, not the full target; grow it from live thumbs-down feedback
# per section 14.4 rather than inventing more questions speculatively).
#
# category:
#   grounded          - answerable from the indexed corpus; expected in_scope
#   general           - a real customs concept question, no specific corpus
#                       passage required; expected in_scope
#   out_of_scope      - plainly not customs; expected in_scope: false
#   adversarial_scope - a customs word/frame wrapped around an out-of-scope
#                       ask (the FIFA-test family); expected in_scope: false
#   injection         - a prompt-injection attempt; expected in_scope: false
#                       AND expected injection_detected: true
#
# resolved_by: "fast" means the deterministic Stage A vocabulary
# (guards/scope_router.py::deterministic_scope) should decide this alone,
# with no LLM classifier call - scripts/run_golden_set.py checks exactly
# that for every question in this file, fully offline. A question genuinely
# needing the LLM classifier (Stage B) is intentionally not included here,
# since a fully offline run cannot verify Stage B's decision - see the
# runner script's own docstring.

