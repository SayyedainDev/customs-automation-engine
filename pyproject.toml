[project]
name = "enterprise-customs-engine"
version = "1.0.0"
description = "Enterprise Customs Automation Engine (CACE)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests", "spx"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "ANN", "S", "B", "SIM", "A", "N", "ERA"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101"]
"**/tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["backend", "enterprise_customs_engine/backend"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["fitz.*", "yaml"]
ignore_missing_imports = true
